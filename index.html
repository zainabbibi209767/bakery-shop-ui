<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dough Delight | Freshly Baked</title>
    <link href="https://fonts.googleapis.com/css2?family=Cookie&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100vh; overflow: hidden; font-family: 'Quicksand', sans-serif; }

        .bakery-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Aesthetic Kitchen/Bakery Background */
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1509440159596-0249088772ff?q=80&w=2072') no-repeat center center/cover;
            padding: 20px;
        }

        .main-card {
            width: 95%;
            max-width: 1100px;
            height: 80vh;
            background: #fffdf7; /* Creamy white */
            border-radius: 40px;
            display: flex;
            box-shadow: 0 40px 80px rgba(0,0,0,0.3);
            overflow: hidden;
            border: 1px solid #f3e5f5;
        }

        /* Left Side: Visual */
        .visual-panel {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .pastry-pic {
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1555507036-ab1f4038808a?q=80&w=1926') no-repeat center center/cover;
            transition: transform 1.5s ease;
        }

        .main-card:hover .pastry-pic {
            transform: scale(1.1);
        }

        /* Right Side: Content */
        .info-panel {
            flex: 1.2;
            padding: 60px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #fff;
        }

        .tagline {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #d4a373;
            font-weight: 700;
            margin-bottom: 15px;
        }

        h1 {
            font-family: 'Cookie', cursive;
            font-size: 5.5rem;
            color: #5d4037;
            line-height: 0.8;
            margin-bottom: 25px;
        }

        h1 span {
            color: #d4a373;
            font-size: 4rem;
            font-family: 'Quicksand', sans-serif;
            display: block;
            font-weight: 700;
        }

        p {
            color: #795548;
            line-height: 1.8;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .order-btn {
            padding: 18px 45px;
            background: #d4a373;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.4s;
            width: fit-content;
            box-shadow: 0 10px 20px rgba(212, 163, 115, 0.3);
        }

        .order-btn:hover {
            background: #5d4037;
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(93, 64, 55, 0.4);
        }

        /* Floating Badge */
        .fresh-badge {
            position: absolute;
            top: 30px;
            right: 30px;
            background: #fff;
            padding: 15px;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: #d4a373;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border: 2px dashed #d4a373;
        }
    </style>
</head>
<body>

    <div class="bakery-wrapper">
        <div class="main-card">
            <!-- Left Image -->
            <div class="visual-panel">
                <div class="pastry-pic"></div>
                <div class="fresh-badge">BAKED TODAY</div>
            </div>

            <!-- Right Content -->
            <div class="info-panel">
                <span class="tagline">Artisanal Bakery</span>
                <h1>Sweet <br><span>Moments.</span></h1>
                <p>Indulge in the warmth of our oven-fresh treats. From buttery croissants to decadent cakes, we bake with love every single morning.</p>
                
                <a href="#" class="order-btn">View Menu</a>
            </div>
        </div>
    </div>

</body>
</html>
